# Dependabot (Sprint 5b) — automated dependency maintenance.
# Weekly PRs for npm + GitHub Actions updates. Patch/minor production updates are
# grouped into one PR to cut review noise; majors stay separate so breaking bumps
# get individual scrutiny. Security updates are raised by Dependabot regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Hold these majors: Next is a pinned stack choice (CLAUDE.md — no stack change
    # without explicit approval), eslint-config-next must track Next's major, and
    # write-excel-file v4 breaks our XLSX export API. Major bumps for these are a
    # deliberate, separately-tested exercise — not an automated PR.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "write-excel-file"
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
