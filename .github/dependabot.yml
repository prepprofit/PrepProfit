# Dependabot (Sprint 5b) — automated dependency maintenance.
# Weekly PRs for npm + GitHub Actions updates. Patch/minor production updates are
# grouped into one PR to cut review noise; majors stay separate so breaking bumps
# get individual scrutiny. Security updates are raised by Dependabot regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
