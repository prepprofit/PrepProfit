name: CI

on:
  push:
    branches: [main]
    # Docs-only commits don't need the full gate — saves ~6 min of the free
    # 2,000 Actions minutes per push (quota was exhausted mid-July 2026).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer push to the same branch/PR cancels the in-flight run instead of
# letting both burn minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Corepack pins npm to the package.json `packageManager` version (npm@10.9.2)
      # so CI and local dev use the SAME npm — preventing the lockfile drift that
      # broke `npm ci` (npm 10 vs 11 record @emnapi/*, @swc/helpers differently).
      - run: corepack enable
      - run: npm -v

      - run: npm ci

      # Fail the build on a known high/critical advisory in the dependency tree.
      # Scoped to prod deps so a dev-only advisory doesn't block shipping; Dependabot
      # (.github/dependabot.yml) raises the actual upgrade PRs.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Tests use PGlite (in-memory Postgres) — no secrets required.
      - name: Test
        run: npm test

      # Catch RSC / server-boundary breaks before they reach Vercel. The Neon
      # client + env validation (lib/db/index.ts, lib/env.ts) are lazy, so no
      # DATABASE_URL is needed at build. Clerk needs valid-format keys to compile
      # the root layout's ClerkProvider — real test-instance keys can be set as
      # repo secrets; otherwise these harmless dummies (example.com) keep CI green.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_dummy_build_only_secret_key' }}

  # Playwright launch smoke (Sprint 5b). Opt-in: runs only when the repo variable
  # RUN_E2E == 'true' AND a Clerk TEST instance + a seeded user are provided as
  # secrets. Until then it is skipped (never a red X) — the public-only smoke can
  # still be run manually with `npm run test:e2e`. See tests/e2e/smoke.spec.ts.
  e2e:
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: corepack enable
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_KITCHEN_EMAIL: ${{ secrets.E2E_KITCHEN_EMAIL }}
          E2E_KITCHEN_PASSWORD: ${{ secrets.E2E_KITCHEN_PASSWORD }}
