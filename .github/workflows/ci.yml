name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is generated by npm 11 (the dev environment). Node 22 ships
      # npm 10, which reads npm 11's optional-dep tree as out-of-sync (Missing:
      # @emnapi/*, @swc/helpers) and fails `npm ci` with EUSAGE. Pin npm to 11 so
      # CI matches local and the lockfile validates.
      - name: Pin npm to 11 (match the lockfile)
        run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Tests use PGlite (in-memory Postgres) — no secrets required.
      - name: Test
        run: npm test

      # Catch RSC / server-boundary breaks before they reach Vercel. The Neon
      # client + env validation (lib/db/index.ts, lib/env.ts) are lazy, so no
      # DATABASE_URL is needed at build. Clerk needs valid-format keys to compile
      # the root layout's ClerkProvider — real test-instance keys can be set as
      # repo secrets; otherwise these harmless dummies (example.com) keep CI green.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_dummy_build_only_secret_key' }}
